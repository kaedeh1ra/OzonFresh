# Переименование репозитория, созданного из шаблона, прямо на GitHub:
# Actions → Rename project → Run workflow, ввести пакет и имя. Результат — коммит в текущую ветку.
# Сам шаблон этот workflow не трогает.
name: Rename project
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Пакет, например ru.myname.coolapp"
        required: true
      name:
        description: "Имя проекта (rootProject.name), например CoolApp"
        required: true
      display_name:
        description: "Отображаемое имя приложения (по умолчанию = имя проекта)"
        required: false

permissions:
  contents: write

jobs:
  rename:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rename
        # Ввод передаётся через env, а не подстановкой в скрипт: так его нельзя выполнить как команду.
        env:
          PACKAGE: ${{ inputs.package }}
          NAME: ${{ inputs.name }}
          DISPLAY_NAME: ${{ inputs.display_name }}
        run: bash ./rename.sh --package "$PACKAGE" --name "$NAME" --display-name "${DISPLAY_NAME:-$NAME}"

      - name: Commit
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename template to $PACKAGE"
          git push
