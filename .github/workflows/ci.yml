name: CI
on:
  push:
  pull_request:

jobs:
  # Android, веб, desktop (JVM) и тесты: всё, что собирается на Linux.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests, Android debug APK, web distribution, desktop app
        run: |
          chmod +x gradlew
          ./gradlew testAndroidHostTest jvmTest \
            :app:androidApp:assembleDebug \
            :app:webApp:wasmJsBrowserDistribution \
            :app:desktopApp:createDistributable --no-daemon

  # iOS и macOS собираются только на Mac.
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: iOS framework, macOS DMG
        run: |
          chmod +x gradlew
          ./gradlew :app:shared:compileKotlinIosArm64 \
            :app:shared:linkDebugFrameworkIosSimulatorArm64 \
            :app:desktopApp:packageDmg --no-daemon

      # Xcode сам вызывает Gradle (embedAndSignAppleFrameworkForXcode), поэтому проверяется и связка проекта с фреймворком.
      - name: iOS app for simulator
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
